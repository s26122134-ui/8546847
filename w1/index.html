<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 引入 FontAwesome 圖示庫與 Google Fonts 字體 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. 全域與馬卡龍漸層背景設計 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 2. 現代感卡片主體（帶微陰影與柔和圓角） */
        .macaron-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(238, 156, 167, 0.25), 0 8px 16px rgba(0, 0, 0, 0.04);
            max-width: 380px;
            width: 100%;
            padding: 36px 28px;
            text-align: center;
            box-sizing: border-box;
        }

        /* 3. 圓形大頭貼與微陰影邊框 */
        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px rgba(244, 143, 177, 0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.06) rotate(3deg);
            box-shadow: 0 15px 30px rgba(244, 143, 177, 0.5);
        }

        /* 4. 名字與簡介文字 */
        .profile-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4a4e69;
            margin: 0 0 6px 0;
        }

        .profile-bio {
            font-size: 0.95rem;
            color: #6c757d;
            margin: 0 0 28px 0;
            line-height: 1.5;
        }

        /* 5. 下方馬卡龍色按鈕樣式 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .macaron-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-instagram {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 90%);
            color: #5d2b38;
            box-shadow: 0 8px 18px rgba(255, 154, 158, 0.35);
        }

        .btn-email {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #1e3a60;
            box-shadow: 0 8px 18px rgba(161, 196, 253, 0.35);
        }

        .macaron-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body>

    <main class="macaron-card">
        <!-- 圓形大頭貼照片 -->
        <div class="avatar-wrapper">
            <img src="https://i.postimg.cc/1t3nJBVM/unnamed.png"大頭照照片" class="avatar-img">
        </div>

        <!-- 名字與一行簡短自我介紹 -->
        <h1 class="profile-name">林小美 May</h1>
        <p class="profile-bio">✨ 用甜美的視覺，記錄生活的每一個美好瞬間。</p>

        <!-- 兩個按鈕 (Instagram / Email) -->
        <div class="button-group">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="macaron-btn btn-instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>追蹤我的 Instagram</span>
            </a>
            
            <a href="mailto:your.email@example.com" class="macaron-btn btn-email">
                <i class="fa-regular fa-envelope"></i>
                <span>傳送 Email 聯繫我</span>
            </a>
        </div>
    </main>

</body>
</html>
