 <!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>

  <!-- 引入 Google Fonts (圓潤可愛的字體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CSS 樣式區塊 -->
  <style>
    /* ==========================================
       1. 全局與主題配色 (甜美清新風)
       ========================================== */
    :root {
      /* 【顏色控制區】可以在這裡輕鬆換色！ */
      --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #f0f7ff 100%); /* 背景漸層：柔粉到粉藍 */
      --primary-color: #ff8fa3;       /* 主色調：草莓牛奶粉 */
      --secondary-color: #ffb3c1;     /* 次要色：淡粉紅 */
      --card-bg: rgba(255, 255, 255, 0.85); /* 卡片背景：半透明牛奶白 */
      --text-dark: #5c4d51;           /* 主要文字顏色：暖深灰棕 */
      --text-muted: #a39296;          /* 次要/時間文字：淺灰粉 */
      --highlight-glow: #ff4d6d;      /* 高亮輪播發光色：鮮豔草莓紅 */
      --card-shadow: 0 8px 24px rgba(255, 182, 193, 0.2); /* 軟綿綿陰影 */
      
      /* 【輪播動畫設定】控制淡入淡出速度 */
      --transition-speed: 0.5s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁面標題 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary-color);
      text-shadow: 2px 2px 0px #ffffff;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* ==========================================
       2. 載入中酷炫動畫 (Loading Animation)
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 60px;
    }

    /* 愛心跳動動畫 */
    .heart-loader {
      width: 50px;
      height: 50px;
      background-color: var(--primary-color);
      display: inline-block;
      animation: pulse 1.2s infinite ease-in-out;
      transform: rotate(45deg);
      position: relative;
      border-radius: 5px;
    }

    .heart-loader::before,
    .heart-loader::after {
      content: "";
      width: 50px;
      height: 50px;
      background-color: var(--primary-color);
      border-radius: 50%;
      position: absolute;
    }

    .heart-loader::before {
      top: -25px;
      left: 0;
    }

    .heart-loader::after {
      left: -25px;
      top: 0;
    }

    @keyframes pulse {
      0% { transform: rotate(45deg) scale(0.8); }
      50% { transform: rotate(45deg) scale(1.2); }
      100% { transform: rotate(45deg) scale(0.8); }
    }

    #loading p {
      margin-top: 35px;
      font-weight: bold;
      color: var(--primary-color);
      letter-spacing: 2px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ==========================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-container {
      width: 100%;
      max-width: 1200px;
      /* 關鍵：CSS Column 瀑布流 */
      column-count: 3;
      column-gap: 24px;
      display: none; /* 資料載入完前先隱藏 */
    }

    /* 響應式：手機與平板視窗調整欄數 */
    @media (max-width: 900px) {
      .masonry-container {
        column-count: 2;
      }
    }
    @media (max-width: 600px) {
      .masonry-container {
        column-count: 1;
      }
    }

    /* ==========================================
       4. 留言卡片基礎樣式
       ========================================== */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px); /* 氣泡玻璃質感 */
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      break-inside: avoid; /* 避免卡片在瀑布流跨欄斷裂 */
      box-shadow: var(--card-shadow);
      transition: all var(--transition-speed) cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      opacity: 0.7; /* 預設非焦點卡片微暗 */
      filter: blur(0.5px); /* 預設非焦點卡片微模糊 */
      transform: scale(0.98);
    }

    /* 卡片頭部 (名字與時間) */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--secondary-color);
      padding-bottom: 8px;
    }

    .card-author {
      font-weight: 700;
      color: var(--primary-color);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 卡片內文 */
    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-dark);
      white-space: pre-wrap; /* 保持原留言的換行格式 */
      word-break: break-word;
    }

    /* ==========================================
       5. 隨時間輪播高亮特效 (Highlight)
       ========================================== */
    .card.active {
      opacity: 1 !important;
      filter: blur(0px) !important;
      transform: scale(1.05) translateY(-5px) !important;
      border-color: var(--highlight-glow);
      box-shadow: 0 12px 30px rgba(255, 77, 109, 0.35),
                  0 0 15px rgba(255, 143, 163, 0.5);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 頁面頂部標題區 -->
  <header>
    <h1>💌 朋友對我的動態留言板</h1>
    <p>甜蜜記憶流轉中...</p>
  </header>

  <!-- 載入中酷炫動畫區塊 -->
  <div id="loading">
    <div class="heart-loader"></div>
    <p>讀取留言中...</p>
  </div>

  <!-- 留言卡片瀑布流牆 -->
  <main class="masonry-container" id="wall"></main>

  <!-- JavaScript 邏輯區塊 -->
  <script>
    /* ==========================================
       【參數設定區】可自由調整輪播秒數與資料來源
       ========================================== */
    const CONFIG = {
      // CSV 資料來源網址
      csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgh3EZ0Rs12SG3CfrjxHJuvMsfj5E_kgeff6iD9gXJOKIjcvLGL9KQJCB9giC2e_C3wZ8ilR_9Lze7/pub?output=csv',
      
      // 輪播時間間隔 (毫秒)：3000ms = 3 秒
      carouselInterval: 3000 
    };

    // 全域變數記錄
    let cardElements = []; // 儲存生成的卡片 DOM 節點
    let currentIndex = 0;  // 目前高亮的卡片索引
    let timer = null;       // 輪播計時器

    // 當 DOM 載入完畢後開始執行
    document.addEventListener('DOMContentLoaded', () => {
      fetchMessageData();
    });

    /* ==========================================
       1. 取得並處理 Google 試算表 CSV 資料
       ========================================== */
    async function fetchMessageData() {
      try {
        const response = await fetch(CONFIG.csvUrl);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const csvText = await response.text();
        const messages = parseCSV(csvText);

        // 渲染卡片
        renderCards(messages);

        // 隱藏 Loading 動畫，顯示留言牆
        document.getElementById('loading').style.display = 'none';
        const wall = document.getElementById('wall');
        wall.style.display = 'block';

        // 開始執行輪播特效
        startCarousel();

      } catch (error) {
        console.error('抓取留言資料失敗：', error);
        document.getElementById('loading').innerHTML = `
          <p style="color: #e63946;">😭 讀取留言失敗，請確認網路或試算表設定。</p>
        `;
      }
    }

    /* ==========================================
       2. 正確解析 CSV (妥善處理含有逗號與換行內容)
       ========================================== */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentVal = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          // 處理雙引號轉義 ("") 或開關引號
          if (inQuotes && nextChar === '"') {
            currentVal += '"';
            i++; 
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 跳過 \r\n 的 \n
          }
          row.push(currentVal.trim());
          if (row.some(field => field !== '')) {
            lines.push(row);
          }
          row = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      
      // 處理最後一行
      if (currentVal || row.length > 0) {
        row.push(currentVal.trim());
        lines.push(row);
      }

      // 過濾掉表頭 (時間戳記, 名字, 悄悄話) 並轉換成物件陣列
      // 假設第一列是表頭，因此從 slice(1) 開始處理
      const dataRows = lines.slice(1);

      return dataRows.map(cols => {
        return {
          timestamp: cols[0] || '未知時間',
          name: cols[1] || '匿名朋友',
          content: cols[2] || '（這條留言沒有內容喔）'
        };
      });
    }

    /* ==========================================
       3. 動態生成卡片 DOM
       ========================================== */
    function renderCards(messages) {
      const wall = document.getElementById('wall');
      wall.innerHTML = '';

      if (messages.length === 0) {
        wall.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">目前還沒有任何留言喔！</p>';
        return;
      }

      messages.forEach((msg, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // 整理時間顯示格式 (簡單美化)
        const formattedTime = formatTimestamp(msg.timestamp);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">🌸 ${escapeHTML(msg.name)}</span>
            <span class="card-time">${formattedTime}</span>
          </div>
          <div class="card-body">${escapeHTML(msg.content)}</div>
        `;

        wall.appendChild(card);
      });

      // 收集所有生成的卡片節點
      cardElements = Array.from(document.querySelectorAll('.card'));
    }

    /* ==========================================
       4. 隨時間輪播高亮 (Highlight) 特效
       ========================================== */
    function startCarousel() {
      if (cardElements.length === 0) return;

      // 預設先讓第一張高亮
      highlightCard(currentIndex);

      // 設定計時器：每隔 CONFIG.carouselInterval (預設3秒) 切換下一張
      timer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardElements.length;
        highlightCard(currentIndex);
      }, CONFIG.carouselInterval);
    }

    function highlightCard(index) {
      cardElements.forEach((card, i) => {
        if (i === index) {
          card.classList.add('active');
          // 可選：自動將螢幕視角平滑滾動到高亮卡片 (如果留言很多時很實用)
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('active');
        }
      });
    }

    /* ==========================================
       5. 輔助函式 (防止 XSS 攻擊與時間格式化)
       ========================================== */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTimestamp(timeStr) {
      if (!timeStr) return '';
      // 簡單取日期與時間，去除多餘秒數
      return timeStr.split(' ')[0] || timeStr;
    }
  </script>
</body>
</html>
