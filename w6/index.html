<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>✨ 甜心二選一｜拍照雲端投票器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 圓潤可愛中文字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 甜美彈窗 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Canvas Confetti 開票彩帶特效 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #fff1f2 0%, #fffbeb 50%, #f0fdf4 100%);
      min-height: 100vh;
      color: #4a4a4a;
      -webkit-tap-highlight-color: transparent;
    }

    /* 玻璃擬態甜美卡片 */
    .sweet-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #ffe4e6;
      box-shadow: 0 12px 32px -8px rgba(244, 63, 94, 0.12);
    }

    /* 可愛按鈕微彈跳 */
    .btn-bounce {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    }
    .btn-bounce:active {
      transform: scale(0.95);
    }

    /* 1:1 拍照框 */
    .photo-box {
      aspect-ratio: 1 / 1;
      background-image: radial-gradient(#fecdd3 1.5px, transparent 1.5px);
      background-size: 14px 14px;
    }

    /* 進度條動畫 */
    .bar-fill {
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 隱藏原生 file input */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body class="pb-12 px-4 pt-6 flex flex-col items-center">

  <!-- 頂部品牌標題列 -->
  <header class="w-full max-w-md flex items-center justify-between mb-5 relative">
    <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
      <span class="text-2xl">📸</span>
      <div>
        <h1 class="text-xl font-black tracking-wide bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 bg-clip-text text-transparent">
          甜心二選一
        </h1>
        <p class="text-[11px] text-rose-400 font-medium">拍下猶豫・交給朋友決定 ✨</p>
      </div>
    </div>

    <!-- 右側工具 & 隱藏管理員開票彩蛋 -->
    <div class="flex items-center gap-2">
      <!-- CodePen / 快速切換測試按鈕 -->
      <button onclick="promptPollId()" title="輸入編號查詢投票"
        class="text-xs bg-white/80 hover:bg-rose-50 text-rose-500 border border-rose-200 px-2.5 py-1.5 rounded-full font-bold shadow-sm transition">
        🔍 查編號
      </button>

      <!-- 隱藏管理員彩蛋（投票頁面時可點擊觸發提前開票） -->
      <button id="secretAdminBtn" onclick="handleSecretEgg()" title="✨"
        class="w-8 h-8 rounded-full flex items-center justify-center text-rose-200 hover:text-rose-400 transition select-none">
        👑
      </button>
    </div>
  </header>

  <!-- ==================== 區塊 1：建立投票畫面 ==================== -->
  <main id="createView" class="w-full max-w-md sweet-card rounded-3xl p-6 transition-all">
    <div class="flex items-center justify-between mb-4">
      <span class="inline-flex items-center gap-1.5 text-xs font-bold text-rose-500 bg-rose-50 px-3 py-1 rounded-full border border-rose-100">
        🎀 建立新投票
      </span>
      <span class="text-xs text-gray-400">自動裁切 1:1 正方形</span>
    </div>

    <!-- 投票題目 -->
    <div class="mb-5">
      <label class="block text-sm font-bold text-gray-700 mb-1.5">1. 你在猶豫什麼呢？</label>
      <input id="pollTitle" type="text" maxlength="40"
        placeholder="例如：今天午餐吃哪間？這兩件買哪件？"
        class="w-full px-4 py-3 rounded-2xl bg-rose-50/50 border-2 border-rose-100 focus:border-rose-400 focus:bg-white focus:outline-none text-sm font-medium transition" />
    </div>

    <!-- A / B 拍照區 -->
    <div class="mb-5">
      <label class="block text-sm font-bold text-gray-700 mb-2">2. 點擊拍下 A、B 兩張照片</label>
      <div class="grid grid-cols-2 gap-3.5">
        <!-- 選項 A -->
        <label for="inputImgA" class="cursor-pointer group">
          <div class="photo-box relative w-full rounded-2xl border-2 border-dashed border-rose-300 bg-rose-50/40 overflow-hidden flex flex-col items-center justify-center group-hover:border-rose-400 transition">
            <img id="previewA" class="hidden w-full h-full object-cover" alt="選項A預覽" />
            <div id="placeholderA" class="text-center p-3">
              <div class="w-11 h-11 mx-auto mb-1.5 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center text-xl shadow-sm">
                📷
              </div>
              <span class="block text-xs font-bold text-rose-500">拍攝選項 A</span>
              <span class="block text-[10px] text-gray-400 mt-0.5">點擊開啟相機/相簿</span>
            </div>
            <span class="absolute top-2 left-2 bg-rose-500 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow">
              A
            </span>
          </div>
          <input id="inputImgA" type="file" accept="image/*" capture="environment" onchange="handleImageSelect(event, 'A')" />
        </label>

        <!-- 選項 B -->
        <label for="inputImgB" class="cursor-pointer group">
          <div class="photo-box relative w-full rounded-2xl border-2 border-dashed border-amber-300 bg-amber-50/40 overflow-hidden flex flex-col items-center justify-center group-hover:border-amber-400 transition">
            <img id="previewB" class="hidden w-full h-full object-cover" alt="選項B預覽" />
            <div id="placeholderB" class="text-center p-3">
              <div class="w-11 h-11 mx-auto mb-1.5 rounded-full bg-amber-100 text-amber-500 flex items-center justify-center text-xl shadow-sm">
                📷
              </div>
              <span class="block text-xs font-bold text-amber-600">拍攝選項 B</span>
              <span class="block text-[10px] text-gray-400 mt-0.5">點擊開啟相機/相簿</span>
            </div>
            <span class="absolute top-2 left-2 bg-amber-400 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow">
              B
            </span>
          </div>
          <input id="inputImgB" type="file" accept="image/*" capture="environment" onchange="handleImageSelect(event, 'B')" />
        </label>
      </div>
    </div>

    <!-- 截止時間設定 -->
    <div class="mb-6">
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-sm font-bold text-gray-700">3. 設定開票截止時間</label>
        <!-- 快捷時間按鈕 -->
        <div class="flex gap-1">
          <button type="button" onclick="setQuickDeadline(5)" class="text-[11px] bg-pink-100 hover:bg-pink-200 text-pink-600 px-2 py-0.5 rounded-full font-bold transition">+5分</button>
          <button type="button" onclick="setQuickDeadline(30)" class="text-[11px] bg-amber-100 hover:bg-amber-200 text-amber-700 px-2 py-0.5 rounded-full font-bold transition">+30分</button>
          <button type="button" onclick="setQuickDeadline(60)" class="text-[11px] bg-emerald-100 hover:bg-emerald-200 text-emerald-700 px-2 py-0.5 rounded-full font-bold transition">+1小時</button>
        </div>
      </div>
      <input id="pollDeadline" type="datetime-local"
        class="w-full px-4 py-2.5 rounded-2xl bg-amber-50/50 border-2 border-amber-100 focus:border-amber-400 focus:bg-white focus:outline-none text-sm font-medium text-gray-700 transition" />
    </div>

    <!-- 送出建立按鈕 -->
    <button id="createBtn" onclick="createPoll()"
      class="btn-bounce w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-400 via-pink-500 to-amber-400 text-white font-black text-base shadow-lg shadow-rose-200 flex items-center justify-center gap-2">
      <span>✨ 產生專屬投票連結</span>
    </button>
  </main>

  <!-- ==================== 區塊 2：建立成功分享卡片 ==================== -->
  <section id="shareView" class="hidden w-full max-w-md sweet-card rounded-3xl p-6 text-center">
    <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center text-3xl shadow-inner">
      🎉
    </div>
    <h2 class="text-xl font-black text-gray-800 mb-1">投票建立完成！</h2>
    <p class="text-xs text-gray-500 mb-4">照片已安全存入雲端，快傳到群組讓大家投票吧～</p>

    <div class="bg-rose-50/80 border border-rose-200 rounded-2xl p-3 mb-4 text-left">
      <div class="flex items-center justify-between text-[11px] text-rose-400 font-bold mb-1">
        <span>專屬投票編號：<span id="createdPollIdText" class="text-rose-600"></span></span>
        <span>已複製可貼上</span>
      </div>
      <input id="shareUrlInput" type="text" readonly
        class="w-full bg-white text-xs text-gray-600 px-3 py-2 rounded-xl border border-rose-100 focus:outline-none" />
    </div>

    <div class="grid grid-cols-2 gap-3 mb-3">
      <button onclick="copyShareLink()"
        class="btn-bounce py-3 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm shadow-md shadow-rose-200">
        📋 複製分享連結
      </button>
      <button onclick="enterCreatedPoll()"
        class="btn-bounce py-3 rounded-2xl bg-amber-400 hover:bg-amber-500 text-white font-bold text-sm shadow-md shadow-amber-200">
        🚀 立即前往投票
      </button>
    </div>

    <button onclick="goHome()" class="text-xs text-gray-400 hover:text-rose-500 underline mt-2">
      + 再建立一個新投票
    </button>
  </section>

  <!-- ==================== 區塊 3：投票與開票結果畫面 ==================== -->
  <section id="voteView" class="hidden w-full max-w-md sweet-card rounded-3xl p-6">
    <!-- 狀態列與倒數計時 -->
    <div class="flex items-center justify-between gap-2 mb-3">
      <span id="pollBadge" class="inline-flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700">
        🟢 投票進行中
      </span>
      <span id="pollIdBadge" class="text-[11px] font-mono text-gray-400 bg-gray-100 px-2.5 py-0.5 rounded-full">
        #P0000
      </span>
    </div>

    <!-- 倒數計時器橫幅 -->
    <div id="countdownBox" class="mb-4 rounded-2xl bg-gradient-to-r from-rose-50 to-amber-50 border border-rose-100 px-4 py-2.5 flex items-center justify-between">
      <span class="text-xs font-bold text-rose-500">⏳ 距離自動開票</span>
      <span id="countdownTimer" class="font-mono text-sm font-black text-amber-600 tracking-wider">
        計算中...
      </span>
    </div>

    <!-- 投票題目 -->
    <h2 id="displayTitle" class="text-xl font-black text-gray-800 text-center mb-5 leading-snug">
      載入題目中...
    </h2>

    <!-- 兩張照片對決區 -->
    <div class="grid grid-cols-2 gap-3.5 mb-5">
      <!-- 卡片 A -->
      <div id="cardA" onclick="submitVote('A')"
        class="btn-bounce cursor-pointer group relative rounded-2xl border-2 border-rose-200 bg-white p-2 shadow-sm hover:border-rose-400 transition">
        <div class="relative aspect-square w-full rounded-xl overflow-hidden bg-rose-50 mb-2">
          <img id="displayImgA" src="" alt="選項A" class="w-full h-full object-cover" />
          <span class="absolute top-2 left-2 bg-rose-500 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow">
            A
          </span>
          <!-- 獲勝皇冠 -->
          <div id="winnerBadgeA" class="hidden absolute inset-0 bg-rose-500/20 flex items-center justify-center">
            <span class="bg-amber-400 text-white text-xs font-black px-3 py-1 rounded-full shadow-lg animate-bounce">
              👑 最高票獲勝
            </span>
          </div>
        </div>
        <button id="voteBtnA" type="button"
          class="w-full py-2 rounded-xl bg-rose-50 group-hover:bg-rose-500 text-rose-500 group-hover:text-white font-black text-xs transition">
          投給 A 💗
        </button>
      </div>

      <!-- 卡片 B -->
      <div id="cardB" onclick="submitVote('B')"
        class="btn-bounce cursor-pointer group relative rounded-2xl border-2 border-amber-200 bg-white p-2 shadow-sm hover:border-amber-400 transition">
        <div class="relative aspect-square w-full rounded-xl overflow-hidden bg-amber-50 mb-2">
          <img id="displayImgB" src="" alt="選項B" class="w-full h-full object-cover" />
          <span class="absolute top-2 left-2 bg-amber-400 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow">
            B
          </span>
          <!-- 獲勝皇冠 -->
          <div id="winnerBadgeB" class="hidden absolute inset-0 bg-amber-500/20 flex items-center justify-center">
            <span class="bg-amber-400 text-white text-xs font-black px-3 py-1 rounded-full shadow-lg animate-bounce">
              👑 最高票獲勝
            </span>
          </div>
        </div>
        <button id="voteBtnB" type="button"
          class="w-full py-2 rounded-xl bg-amber-50 group-hover:bg-amber-400 text-amber-600 group-hover:text-white font-black text-xs transition">
          投給 B 💛
        </button>
      </div>
    </div>

    <!-- 開票結果進度條區（時間到 / 管理員開票後顯示） -->
    <div id="resultPanel" class="hidden bg-white rounded-2xl border-2 border-rose-100 p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-black text-gray-800">📊 最終開票結果</span>
        <span id="totalVotesText" class="text-xs font-bold text-rose-500 bg-rose-50 px-2.5 py-0.5 rounded-full">
          共 0 票
        </span>
      </div>

      <!-- A 票數條 -->
      <div class="mb-3">
        <div class="flex justify-between text-xs font-bold mb-1">
          <span class="text-rose-500">選項 A</span>
          <span id="resultTextA" class="text-gray-700">0 票 (0%)</span>
        </div>
        <div class="w-full h-3.5 bg-rose-100 rounded-full overflow-hidden">
          <div id="barA" class="bar-fill h-full bg-gradient-to-r from-rose-400 to-pink-500 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <!-- B 票數條 -->
      <div>
        <div class="flex justify-between text-xs font-bold mb-1">
          <span class="text-amber-600">選項 B</span>
          <span id="resultTextB" class="text-gray-700">0 票 (0%)</span>
        </div>
        <div class="w-full h-3.5 bg-amber-100 rounded-full overflow-hidden">
          <div id="barB" class="bar-fill h-full bg-gradient-to-r from-amber-400 to-orange-400 rounded-full" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- 已投票提示（尚未開票時） -->
    <div id="votedNotice" class="hidden text-center bg-pink-50 border border-pink-200 rounded-2xl p-3 mb-4">
      <p class="text-xs font-bold text-pink-600">🎀 你已經投過票囉！靜待倒數結束自動開票～</p>
    </div>

    <!-- 底部操作列 -->
    <div class="flex items-center justify-between pt-2 border-t border-rose-100 text-xs">
      <button onclick="copyCurrentPollLink()" class="text-rose-500 font-bold hover:underline">
        🔗 分享此投票連結
      </button>
      <button onclick="refreshPollData()" class="text-gray-400 hover:text-gray-600">
        🔄 重新整理狀態
      </button>
    </div>
  </section>

  <!-- 全螢幕甜美 Loading 遮罩 -->
  <div id="loadingOverlay" class="hidden fixed inset-0 bg-white/75 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
    <div class="w-14 h-14 rounded-full border-4 border-rose-200 border-t-rose-500 animate-spin mb-3"></div>
    <p id="loadingText" class="text-sm font-bold text-rose-500 animate-pulse">正在同步雲端資料...</p>
  </div>

  <script>
    // ==================== 系統設定 ====================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzbgD0ZoyC1Qjpgkq8DwKdYyF_pISQuH1d7KyPNA4WjQW7GrXT4AOGsmz-otTszl6nF/exec";

    // 全域狀態
    let base64ImgA = "";
    let base64ImgB = "";
    let currentPollId = "";
    let currentPollData = null;
    let countdownInterval = null;
    let adminClickCount = 0;

    // ==================== 初始化 ====================
    window.addEventListener("DOMContentLoaded", () => {
      // 預設截止時間為 30 分鐘後
      setQuickDeadline(30);

      // 檢查網址是否有 ?poll=P...
      const urlParams = new URLSearchParams(window.location.search);
      const pollParam = urlParams.get("poll");

      if (pollParam) {
        loadPoll(pollParam);
      } else {
        showSection("createView");
      }
    });

    // ==================== 畫面切換控制 ====================
    function showSection(sectionId) {
      ["createView", "shareView", "voteView"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(sectionId).classList.remove("hidden");
    }

    function goHome() {
      if (countdownInterval) clearInterval(countdownInterval);
      currentPollId = "";
      currentPollData = null;
      // 嘗試清除網址參數（在 CodePen iframe 中若受限則自動忽略）
      try {
        window.history.pushState({}, "", window.location.pathname);
      } catch (e) {}
      showSection("createView");
    }

    function toggleLoading(show, text = "處理中...") {
      const overlay = document.getElementById("loadingOverlay");
      document.getElementById("loadingText").textContent = text;
      overlay.classList.toggle("hidden", !show);
    }

    // ==================== 時間處理工具 ====================
    function setQuickDeadline(minutes) {
      const now = new Date(Date.now() + minutes * 60000);
      // 轉換為本地時間 YYYY-MM-DDTHH:mm 格式供 datetime-local 使用
      const tzOffset = now.getTimezoneOffset() * 60000;
      const localISOTime = new Date(now - tzOffset).toISOString().slice(0, 16);
      document.getElementById("pollDeadline").value = localISOTime;
    }

    // ==================== 1. 手機拍照 & Canvas 1:1 自動裁切壓縮 ====================
    function handleImageSelect(event, option) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // 建立 800x800 正方形 Canvas
          const targetSize = 800;
          const canvas = document.createElement("canvas");
          canvas.width = targetSize;
          canvas.height = targetSize;
          const ctx = canvas.getContext("2d");

          // 計算置中 1:1 裁切座標
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;

          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, targetSize, targetSize);

          // 壓縮輸出為 JPEG (品質 0.78，兼顧清晰與上傳速度)
          const compressedBase64 = canvas.toDataURL("image/jpeg", 0.78);

          if (option === "A") {
            base64ImgA = compressedBase64;
            document.getElementById("previewA").src = compressedBase64;
            document.getElementById("previewA").classList.remove("hidden");
            document.getElementById("placeholderA").classList.add("hidden");
          } else {
            base64ImgB = compressedBase64;
            document.getElementById("previewB").src = compressedBase64;
            document.getElementById("previewB").classList.remove("hidden");
            document.getElementById("placeholderB").classList.add("hidden");
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ==================== 2. 建立投票並上傳 GAS ====================
    async function createPoll() {
      const title = document.getElementById("pollTitle").value.trim();
      const deadlineVal = document.getElementById("pollDeadline").value;

      if (!title) {
        return Swal.fire({ icon: "warning", title: "請輸入投票題目", confirmButtonColor: "#f43f5e" });
      }
      if (!base64ImgA || !base64ImgB) {
        return Swal.fire({ icon: "warning", title: "請先拍好 A 與 B 兩張照片喔！", confirmButtonColor: "#f43f5e" });
      }
      if (!deadlineVal) {
        return Swal.fire({ icon: "warning", title: "請設定開票截止時間", confirmButtonColor: "#f43f5e" });
      }

      // 產生專屬編號 P + 時間戳後6碼 + 2碼隨機
      const pollId = "P" + Date.now().toString().slice(-6) + Math.floor(10 + Math.random() * 90);
      // 將本地時間轉為標準 ISO 字串存入 Google Sheets，確保跨裝置解析一致
      const deadlineISO = new Date(deadlineVal).toISOString();

      toggleLoading(true, "正在將美照上傳至雲端並建立投票...");

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "create",
            pollId: pollId,
            title: title,
            imgA: base64ImgA,
            imgB: base64ImgB,
            deadline: deadlineISO
          })
        });

        const result = await response.json();
        toggleLoading(false);

        if (result.success) {
          currentPollId = pollId;
          // 組合分享連結
          const baseUrl = window.location.href.split("?")[0];
          const shareUrl = `${baseUrl}?poll=${pollId}`;

          document.getElementById("createdPollIdText").textContent = pollId;
          document.getElementById("shareUrlInput").value = shareUrl;
          showSection("shareView");
        } else {
          throw new Error(result.error || "建立失敗");
        }
      } catch (err) {
        toggleLoading(false);
        Swal.fire({
          icon: "error",
          title: "上傳發生錯誤",
          text: "請確認網路連線或 GAS 權限設定：" + err.message,
          confirmButtonColor: "#f43f5e"
        });
      }
    }

    function copyShareLink() {
      const input = document.getElementById("shareUrlInput");
      input.select();
      navigator.clipboard.writeText(input.value);
      Swal.fire({
        toast: true,
        position: "top",
        icon: "success",
        title: "已複製專屬連結！快去貼給朋友吧 🎀",
        showConfirmButton: false,
        timer: 2000
      });
    }

    function enterCreatedPoll() {
      try {
        window.history.pushState({}, "", `?poll=${currentPollId}`);
      } catch (e) {}
      loadPoll(currentPollId);
    }

    // ==================== 3. 讀取投票與倒數開票邏輯 ====================
    async function loadPoll(pollId) {
      currentPollId = pollId;
      toggleLoading(true, "正在讀取投票資料...");

      try {
        const res = await fetch(`${GAS_API_URL}?poll=${encodeURIComponent(pollId)}`);
        const data = await res.json();
        toggleLoading(false);

        if (data.error) {
          Swal.fire({ icon: "error", title: "找不到此投票", text: data.error, confirmButtonColor: "#f43f5e" });
          return showSection("createView");
        }

        currentPollData = data;
        renderVoteScreen(data);
        showSection("voteView");
      } catch (err) {
        toggleLoading(false);
        Swal.fire({ icon: "error", title: "讀取失敗", text: err.message, confirmButtonColor: "#f43f5e" });
      }
    }

    function refreshPollData() {
      if (currentPollId) loadPoll(currentPollId);
    }

    function renderVoteScreen(data) {
      document.getElementById("pollIdBadge").textContent = `#${data.id}`;
      document.getElementById("displayTitle").textContent = data.title;
      document.getElementById("displayImgA").src = data.imgA;
      document.getElementById("displayImgB").src = data.imgB;

      if (countdownInterval) clearInterval(countdownInterval);

      const checkStatusAndRender = () => {
        const now = new Date();
        const deadline = data.deadline ? new Date(data.deadline) : null;
        const isExpired = deadline && (now >= deadline);
        const isRevealed = data.status === "revealed" || isExpired;

        if (isRevealed) {
          if (countdownInterval) clearInterval(countdownInterval);
          showRevealedResults(data);
        } else {
          // 尚在投票期間
          document.getElementById("pollBadge").className = "inline-flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700";
          document.getElementById("pollBadge").textContent = "🟢 投票進行中";
          document.getElementById("resultPanel").classList.add("hidden");
          document.getElementById("winnerBadgeA").classList.add("hidden");
          document.getElementById("winnerBadgeB").classList.add("hidden");

          // 檢查此瀏覽器是否已經投過票
          const hasVoted = localStorage.getItem(`voted_${data.id}`);
          if (hasVoted) {
            lockVoteButtons(hasVoted);
            document.getElementById("votedNotice").classList.remove("hidden");
          } else {
            unlockVoteButtons();
            document.getElementById("votedNotice").classList.add("hidden");
          }

          // 更新倒數文字
          if (deadline) {
            const diff = deadline - now;
            const hrs = Math.floor(diff / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            document.getElementById("countdownTimer").textContent =
              `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
          } else {
            document.getElementById("countdownTimer").textContent = "未設定期限";
          }
        }
      };

      checkStatusAndRender();
      countdownInterval = setInterval(checkStatusAndRender, 1000);
    }

    function lockVoteButtons(votedChoice) {
      ["A", "B"].forEach(opt => {
        const card = document.getElementById(`card${opt}`);
        const btn = document.getElementById(`voteBtn${opt}`);
        card.classList.remove("cursor-pointer", "btn-bounce");
        card.onclick = null;
        if (votedChoice === opt) {
          btn.textContent = `已投給 ${opt} 💖`;
          btn.className = "w-full py-2 rounded-xl bg-rose-500 text-white font-black text-xs";
        } else {
          btn.textContent = `選項 ${opt}`;
          btn.className = "w-full py-2 rounded-xl bg-gray-100 text-gray-400 font-bold text-xs";
        }
      });
    }

    function unlockVoteButtons() {
      document.getElementById("cardA").onclick = () => submitVote("A");
      document.getElementById("cardB").onclick = () => submitVote("B");
      document.getElementById("voteBtnA").textContent = "投給 A 💗";
      document.getElementById("voteBtnB").textContent = "投給 B 💛";
    }

    // ==================== 4. 送出投票 ====================
    async function submitVote(choice) {
      if (!currentPollData) return;
      if (localStorage.getItem(`voted_${currentPollData.id}`)) return;

      toggleLoading(true, `正在把愛心投給選項 ${choice}...`);

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "vote",
            pollId: currentPollData.id,
            choice: choice
          })
        });

        const result = await res.json();
        toggleLoading(false);

        if (result.success) {
          localStorage.setItem(`voted_${currentPollData.id}`, choice);
          // 本地端先即時 +1 並重新整理狀態
          if (choice === "A") currentPollData.votesA++;
          if (choice === "B") currentPollData.votesB++;

          Swal.fire({
            icon: "success",
            title: `成功投給選項 ${choice}！`,
            text: "時間一到就會自動揭曉結果喔～",
            timer: 1800,
            showConfirmButton: false
          });
          renderVoteScreen(currentPollData);
        } else {
          Swal.fire({ icon: "info", title: result.error || "投票已結束", confirmButtonColor: "#f43f5e" });
          loadPoll(currentPollData.id);
        }
      } catch (err) {
        toggleLoading(false);
        Swal.fire({ icon: "error", title: "投票失敗", text: err.message, confirmButtonColor: "#f43f5e" });
      }
    }

    // ==================== 5. 開票結果顯示 ====================
    function showRevealedResults(data) {
      document.getElementById("pollBadge").className = "inline-flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full bg-rose-100 text-rose-600";
      document.getElementById("pollBadge").textContent = "🎉 已正式開票";
      document.getElementById("countdownTimer").textContent = "已截止開票";
      document.getElementById("votedNotice").classList.add("hidden");

      // 鎖定卡片點擊
      ["A", "B"].forEach(opt => {
        const card = document.getElementById(`card${opt}`);
        card.classList.remove("cursor-pointer", "btn-bounce");
        card.onclick = null;
      });

      const votesA = Number(data.votesA || 0);
      const votesB = Number(data.votesB || 0);
      const total = votesA + votesB;
      const pctA = total === 0 ? 0 : Math.round((votesA / total) * 100);
      const pctB = total === 0 ? 0 : 100 - pctA;

      document.getElementById("totalVotesText").textContent = `共 ${total} 票`;
      document.getElementById("resultTextA").textContent = `${votesA} 票 (${pctA}%)`;
      document.getElementById("resultTextB").textContent = `${votesB} 票 (${pctB}%)`;
      document.getElementById("voteBtnA").textContent = `${votesA} 票 (${pctA}%)`;
      document.getElementById("voteBtnB").textContent = `${votesB} 票 (${pctB}%)`;

      document.getElementById("resultPanel").classList.remove("hidden");
      setTimeout(() => {
        document.getElementById("barA").style.width = `${pctA}%`;
        document.getElementById("barB").style.width = `${pctB}%`;
      }, 100);

      // 標示最高票皇冠
      document.getElementById("winnerBadgeA").classList.toggle("hidden", !(votesA > votesB));
      document.getElementById("winnerBadgeB").classList.toggle("hidden", !(votesB > votesA));
    }

    // ==================== 6. 隱藏管理員提前開票彩蛋 ====================
    async function handleSecretEgg() {
      // 只有在投票畫面中才觸發管理員彩蛋
      if (document.getElementById("voteView").classList.contains("hidden") || !currentPollData) {
        Swal.fire({
          toast: true,
          position: "top",
          icon: "info",
          title: "👑 這是房主專屬的隱藏開票小彩蛋喔！",
          showConfirmButton: false,
          timer: 1800
        });
        return;
      }

      adminClickCount++;
      if (adminClickCount < 3) return; // 連點 3 下防止誤觸
      adminClickCount = 0;

      const confirm = await Swal.fire({
        title: "👑 房主隱藏彩蛋",
        text: "確定要立刻提前結束投票並公布開票結果嗎？",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#f43f5e",
        cancelButtonColor: "#9ca3af",
        confirmButtonText: "立即開票！",
        cancelButtonText: "再等等"
      });

      if (!confirm.isConfirmed) return;

      toggleLoading(true, "正在通知雲端提前開票...");

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "reveal",
            pollId: currentPollData.id
          })
        });
        const result = await res.json();
        toggleLoading(false);

        if (result.success) {
          // 施放開票彩帶特效
          confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
          await loadPoll(currentPollData.id);
        }
      } catch (err) {
        toggleLoading(false);
        Swal.fire({ icon: "error", title: "開票失敗", text: err.message });
      }
    }

    // ==================== 7. CodePen 輔助查詢工具 ====================
    async function promptPollId() {
      const { value: pid } = await Swal.fire({
        title: "🔍 查詢投票",
        input: "text",
        inputLabel: "請輸入投票編號（例如：P12345678）",
        inputPlaceholder: "P...",
        showCancelButton: true,
        confirmButtonColor: "#f43f5e",
        confirmButtonText: "進入投票",
        cancelButtonText: "取消"
      });

      if (pid && pid.trim()) {
        loadPoll(pid.trim());
      }
    }

    function copyCurrentPollLink() {
      const baseUrl = window.location.href.split("?")[0];
      const shareUrl = `${baseUrl}?poll=${currentPollId}`;
      navigator.clipboard.writeText(shareUrl);
      Swal.fire({
        toast: true,
        position: "top",
        icon: "success",
        title: `已複製連結（編號：${currentPollId}）`,
        showConfirmButton: false,
        timer: 2000
      });
    }
  </script>
</body>
